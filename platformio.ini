; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

[common]
; pinned to Arduino core 2.x, the BLE code relies on its std::string API
platform = espressif32@^6
framework = arduino
; two OTA app slots (1.9 MB each) plus a small LittleFS partition for images
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    ErriezCRC32

[env:esp32dev]
extends = common
board = esp32dev

[env:esp32-c3-devkitm-1]
extends = common
board = esp32-c3-devkitm-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_ESP32C3_DEV=1
    -D CORE_DEBUG_LEVEL=0
;; https://www.esp32.com/viewtopic.php?t=32621
