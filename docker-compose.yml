services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      PIXEL_DISPLAY_HOST: ${PIXEL_DISPLAY_HOST:?Set PIXEL_DISPLAY_HOST in .env, see .env.example}
    ports:
      - "${WEB_PORT:-8032}:8000"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
