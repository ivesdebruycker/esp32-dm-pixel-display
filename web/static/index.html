<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Display</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f2; --panel: #ffffff; --text: #1f2328; --muted: #646b73;
    --line: #d9dbdd; --accent: #2457c5; --accent-text: #ffffff;
    --good: #18794e; --bad: #c0362c; --warn: #a15c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --panel: #1f2227; --text: #e8eaed; --muted: #a0a6ad;
      --line: #363a40; --accent: #7ba2f5; --accent-text: #10141b;
      --good: #4cc38a; --bad: #ff7b72; --warn: #e3a341;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  h1 { font-size: 1.25rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  #connection { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  #details { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 0; }
  #details dt { color: var(--muted); font-size: .85rem; }
  #details dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  #drop {
    display: block; border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px;
    text-align: center; cursor: pointer;
  }
  #drop.over, #drop:hover { border-color: var(--accent); }
  #drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  #drop small { display: block; color: var(--muted); margin-top: 4px; }
  #file { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #result[hidden] { display: none; }
  #result { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; align-items: flex-start; }
  #preview {
    width: 224px; height: 224px; max-width: 100%; background: #000; border-radius: 6px;
    image-rendering: pixelated; flex: none;
  }
  #info { flex: 1 1 200px; min-width: 0; }
  #info p { margin: 0 0 12px; color: var(--muted); overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text); min-height: 42px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #message { min-height: 1.45em; margin: 0; font-weight: 600; }
  #message.ok { color: var(--good); }
  #message.error { color: var(--bad); }
  #message.busy { color: var(--muted); }
  .spacer { flex: 1 1 auto; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pixel Display</h1>
    <span id="connection"><span id="dot" aria-hidden="true"></span><span id="connection-text">Checking…</span></span>
  </header>

  <section class="panel" aria-labelledby="status-title">
    <h2 id="status-title">Status</h2>
    <dl id="details">
      <div><dt>Display</dt><dd id="display">–</dd></div>
      <div><dt>Mode</dt><dd id="mode">–</dd></div>
      <div><dt>Stored images</dt><dd id="images">–</dd></div>
      <div><dt>Wi-Fi signal</dt><dd id="signal">–</dd></div>
      <div><dt>Address</dt><dd id="address">–</dd></div>
    </dl>
  </section>

  <section class="panel" aria-labelledby="image-title">
    <h2 id="image-title">Image</h2>
    <label id="drop">
      <input id="file" type="file" accept="image/*">
      <strong>Drop an image here or choose a file</strong>
      <small>It's cropped to a centred square and resized to 32×32 automatically</small>
    </label>
    <div id="result" hidden>
      <img id="preview" alt="Preview of the converted image, enlarged">
      <div id="info">
        <p id="summary"></p>
        <div class="actions">
          <button id="show" class="primary" type="button">Show now</button>
          <button id="save" type="button">Save to board</button>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" aria-labelledby="control-title">
    <h2 id="control-title">Display control</h2>
    <div class="actions">
      <button id="slideshow-start" type="button">Start slideshow</button>
      <button id="slideshow-stop" type="button">Stop slideshow</button>
      <button id="clock" type="button">Show clock</button>
      <span class="spacer"></span>
      <button id="clear" class="danger" type="button">Clear stored images</button>
    </div>
  </section>

  <p id="message" role="status" aria-live="polite"></p>
</main>

<script>
const $ = id => document.getElementById(id);
let converted = null;
let previewUrl = null;
let busy = false;

function setMessage(text, kind = "") {
  $("message").textContent = text;
  $("message").className = kind;
}

async function errorText(response) {
  try {
    const body = await response.json();
    if (typeof body.detail === "string") return body.detail;
  } catch {}
  return `Request failed (${response.status})`;
}

function setBusy(value) {
  busy = value;
  document.querySelectorAll("button").forEach(button => { button.disabled = value; });
}

async function run(label, action) {
  if (busy) return;
  setBusy(true);
  setMessage(label, "busy");
  try {
    const text = await action();
    setMessage(text, "ok");
  } catch (error) {
    const offline = error instanceof TypeError;
    setMessage(offline ? "Could not reach the web UI server" : error.message, "error");
  } finally {
    setBusy(false);
    refreshStatus();
  }
}

async function post(url, body) {
  const response = await fetch(url, { method: "POST", body });
  if (!response.ok) throw new Error(await errorText(response));
  return response;
}

function formatBytes(bytes) {
  return `${Number(bytes).toLocaleString()} bytes`;
}

function handleFile(file) {
  if (!file) return;
  run(`Converting ${file.name}…`, async () => {
    const form = new FormData();
    form.append("file", file);
    const response = await post("/api/convert", form);
    converted = await response.blob();

    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(converted);
    $("preview").src = previewUrl;

    const colors = response.headers.get("X-Image-Colors");
    const original = response.headers.get("X-Original-Size");
    $("summary").textContent = `${file.name}: ${original} → 32×32, `
      + formatBytes(response.headers.get("X-Image-Bytes"))
      + (colors ? `, reduced to ${colors} colours` : "");
    $("result").hidden = false;
    return "Ready. Check the preview, then show or save it.";
  });
}

function sendConverted(url, label) {
  if (!converted) return;
  run(label, async () => {
    const form = new FormData();
    form.append("file", converted, "image.png");
    const response = await post(url, form);
    return (await response.json()).message;
  });
}

function sendCommand(url, label) {
  run(label, async () => {
    const response = await post(url);
    return (await response.json()).message;
  });
}

const MODE_NAMES = { slideshow: "Slideshow", clock: "Clock", idle: "Paused" };

function signalName(rssi) {
  if (rssi >= -60) return "good";
  if (rssi >= -72) return "fair";
  return "weak";
}

async function refreshStatus() {
  let status = null;
  try {
    const response = await fetch("/api/status");
    if (response.ok) status = await response.json();
  } catch {}

  const board = status && status.board;
  const online = Boolean(status && status.online);
  const color = !status || !online ? "var(--bad)"
    : board.display_connected ? "var(--good)" : "var(--warn)";
  $("dot").style.background = color;
  $("connection-text").textContent = !status ? "Web UI server unreachable"
    : !online ? "Board offline"
    : board.display_connected ? "Online" : "Board online, display disconnected";

  $("display").textContent = online ? (board.display_connected ? "Connected" : "Disconnected") : "–";
  $("mode").textContent = online ? (MODE_NAMES[board.mode] || board.mode) : "–";
  $("images").textContent = online ? `${board.images} of ${board.max_images}` : "–";
  $("signal").textContent = online ? `${board.wifi_rssi} dBm (${signalName(board.wifi_rssi)})` : "–";
  $("address").textContent = online ? board.ip : "–";

  const mode = online ? board.mode : null;
  $("slideshow-start").setAttribute("aria-pressed", mode === "slideshow");
  $("clock").setAttribute("aria-pressed", mode === "clock");
}

$("file").addEventListener("change", event => {
  handleFile(event.target.files[0]);
  event.target.value = "";
});
const drop = $("drop");
["dragenter", "dragover"].forEach(name => drop.addEventListener(name, event => {
  event.preventDefault();
  drop.classList.add("over");
}));
["dragleave", "drop"].forEach(name => drop.addEventListener(name, event => {
  event.preventDefault();
  drop.classList.remove("over");
}));
drop.addEventListener("drop", event => handleFile(event.dataTransfer.files[0]));

$("show").addEventListener("click", () => sendConverted("/api/show", "Sending to the display…"));
$("save").addEventListener("click", () => sendConverted("/api/save", "Saving to the board…"));
$("slideshow-start").addEventListener("click", () => sendCommand("/api/slideshow/start", "Starting the slideshow…"));
$("slideshow-stop").addEventListener("click", () => sendCommand("/api/slideshow/stop", "Stopping the slideshow…"));
$("clock").addEventListener("click", () => sendCommand("/api/clock", "Starting the clock…"));
$("clear").addEventListener("click", () => {
  if (confirm("Remove all images stored on the board? This can't be undone.")) {
    sendCommand("/api/images/clear", "Removing the stored images…");
  }
});

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
